<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="textus-resource:panel.css" />
  </head>
  <body>
    <main>
      <header>
        <h1 data-t="name"></h1>
        <p class="muted" data-t="intro"></p>
        <p id="root" class="root"></p>
      </header>
      <section class="sync-status" aria-label="Sync status">
        <p id="status" role="status" aria-live="polite" data-t="loading"></p>
        <progress id="progress" hidden></progress>
        <p id="last-run" class="muted" hidden></p>
        <div class="actions">
          <button
            type="button"
            class="primary"
            id="sync"
            data-t="sync"
            disabled
          ></button>
          <button type="button" id="cancel" data-t="cancel" hidden></button>
        </div>
        <div id="results"></div>
      </section>
      <form id="connection" autocomplete="off">
        <fieldset id="fields" disabled>
          <div class="field">
            <label for="provider" data-t="provider"></label
            ><select id="provider">
              <option value="s3" data-t="s3"></option>
              <option value="webdav" data-t="webdav"></option>
              <option value="nutstore" data-t="nutstore"></option>
            </select>
          </div>
          <p id="nutstore-help" class="hint" data-t="nutstoreHelp" hidden></p>
          <div class="field">
            <label for="endpoint" data-t="endpoint"></label
            ><input
              id="endpoint"
              type="url"
              placeholder="https://"
              spellcheck="false"
            />
          </div>
          <div class="columns" id="s3-fields">
            <div class="field">
              <label for="bucket" data-t="bucket"></label
              ><input id="bucket" spellcheck="false" />
            </div>
            <div class="field">
              <label for="region" data-t="region"></label
              ><input id="region" spellcheck="false" />
            </div>
            <label class="check wide"
              ><input id="pathStyle" type="checkbox" /><span
                data-t="pathStyle"
              ></span
            ></label>
          </div>
          <div class="field">
            <label for="prefix" data-t="prefix"></label
            ><input
              id="prefix"
              required
              aria-describedby="prefix-help"
              spellcheck="false"
            />
            <p id="prefix-help" class="hint" data-t="prefixHelp"></p>
          </div>
          <div class="columns">
            <div class="field">
              <label for="account" data-t="account"></label
              ><input id="account" autocomplete="off" spellcheck="false" />
            </div>
            <div class="field">
              <label for="secret" data-t="secret"></label
              ><input id="secret" type="password" autocomplete="new-password" />
            </div>
          </div>
          <div class="field" id="token-field">
            <label for="token" data-t="token"></label
            ><input id="token" type="password" autocomplete="new-password" />
          </div>
          <p id="credentials-state" class="hint"></p>
          <p class="hint" data-t="credentialsHelp"></p>
          <h2 data-t="encryptionTitle"></h2>
          <p class="hint" id="encryption-help" data-t="encryptionHelp"></p>
          <div class="columns">
            <div class="field">
              <label for="sync-password" data-t="syncPassword"></label>
              <input
                id="sync-password"
                type="password"
                autocomplete="new-password"
                minlength="12"
                maxlength="1024"
                aria-describedby="encryption-help"
              />
            </div>
            <div class="field">
              <label for="confirm-password" data-t="confirmPassword"></label>
              <input
                id="confirm-password"
                type="password"
                autocomplete="new-password"
                maxlength="1024"
              />
            </div>
          </div>
          <p class="hint" data-t="passwordRecovery"></p>
          <label class="check automatic"
            ><input id="automatic" type="checkbox" /><span
              data-t="automatic"
            ></span
          ></label>
          <div class="field" id="interval-field">
            <label for="interval" data-t="interval"></label
            ><input
              id="interval"
              type="number"
              min="5"
              max="1440"
              step="1"
              required
            />
          </div>
          <div class="actions">
            <button type="button" id="save" data-t="save"></button
            ><button type="button" id="test" data-t="test" disabled></button>
          </div>
        </fieldset>
      </form>
      <section class="scope">
        <h2 data-t="scopeTitle"></h2>
        <p data-t="scope"></p>
        <p data-t="behavior"></p>
        <p class="muted" data-t="privacy"></p>
      </section>
      <details>
        <summary data-t="advanced"></summary>
        <p class="hint" data-t="unlockHelp"></p>
        <button type="button" id="unlock" data-t="unlock" disabled></button>
      </details>
    </main>
    <script src="textus-resource:panel.js"></script>
  </body>
</html>
